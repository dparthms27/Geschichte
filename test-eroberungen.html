<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Online-Test: Entdeckungen und Eroberungen</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caladea:wght@400;700&family=Carlito:wght@400;700&display=swap" rel="stylesheet">
<style>

:root{--bg:#EEF5F4;--surface:#FFFFFF;--ink:#18302F;--muted:#4F6766;--teal:#1F6F78;--teal-soft:#D5E8E8;--orange:#C9661A;--orange-soft:#FBE3CC;--line:#C5D9D8;--on-teal:#FFFFFF;
--sea:#CFE6E8;--land:#E9DCC0;--coast:#8A7A55;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#0F1C1D;--surface:#172A2B;--ink:#E6F0EF;--muted:#A3BAB8;--teal:#5FB7BF;--teal-soft:#1E3F42;--orange:#F0A25A;--orange-soft:#3E2A17;--line:#2C4547;--on-teal:#0F1C1D;--sea:#16373B;--land:#4A4232;--coast:#8F8264;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0F1C1D;--surface:#172A2B;--ink:#E6F0EF;--muted:#A3BAB8;--teal:#5FB7BF;--teal-soft:#1E3F42;--orange:#F0A25A;--orange-soft:#3E2A17;--line:#2C4547;--on-teal:#0F1C1D;--sea:#16373B;--land:#4A4232;--coast:#8F8264;color-scheme:dark}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Carlito,Calibri,"Segoe UI",Arial,sans-serif;font-size:1.15rem;line-height:1.45}
.wrap{max-width:900px;margin:0 auto;padding:1.5rem 1rem 3rem}
header h1{font-family:Caladea,Cambria,Georgia,serif;font-size:clamp(1.9rem,5vw,2.7rem);line-height:1.1;margin:.2rem 0 .3rem;color:var(--teal)}
header p{margin:0;color:var(--muted)}
.routeline{display:block;width:100%;height:34px;margin:.8rem 0 1.2rem}
.routeline path{fill:none;stroke:var(--orange);stroke-width:2.5;stroke-dasharray:2 8;stroke-linecap:round}
.routeline circle{fill:var(--teal)}
nav{display:flex;flex-wrap:wrap;gap:.5rem;margin-bottom:1.2rem}
nav button{font:inherit;font-size:1rem;padding:.55rem .9rem;border-radius:999px;border:2px solid var(--teal);background:var(--surface);color:var(--teal);cursor:pointer}
nav button[aria-selected="true"]{background:var(--teal);color:var(--on-teal)}
nav button .ok{margin-left:.35rem}
button:focus-visible,.marker:focus-visible{outline:3px solid var(--orange);outline-offset:2px}
section{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:1.3rem 1.2rem 1.5rem}
section[hidden]{display:none}
h2{font-family:Caladea,Cambria,Georgia,serif;font-size:1.6rem;margin:0 0 .3rem}
.task{margin:0 0 1rem;color:var(--muted)}
.lern{color:var(--teal);font-weight:700}
.status{margin-top:1rem;min-height:1.5em;font-weight:700}
.status.good{color:var(--teal)}
.tools{display:flex;gap:.6rem;flex-wrap:wrap;margin-top:1rem}
.btn{font:inherit;font-size:1rem;padding:.6rem 1.1rem;border-radius:10px;border:2px solid var(--teal);cursor:pointer;background:var(--teal);color:var(--on-teal)}
.btn.ghost{background:transparent;color:var(--teal)}
.btn:disabled{opacity:.4;cursor:default}
.card{font:inherit;text-align:left;padding:.6rem .8rem;border-radius:10px;border:2px solid var(--line);background:var(--bg);color:var(--ink);cursor:pointer}
.card.sel{border-color:var(--orange);background:var(--orange-soft)}
.wrong{animation:shake .35s}
@keyframes shake{0%,100%{transform:none}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
@media (prefers-reduced-motion: reduce){.wrong{animation:none}}
.pool{display:flex;flex-wrap:wrap;gap:.5rem;margin-bottom:1.1rem;min-height:2.8rem}
/* Zeitleiste */
.timeline{position:relative;display:grid;grid-template-columns:repeat(4,1fr);gap:.7rem;padding-top:2.2rem}
.timeline::before{content:"";position:absolute;left:0;right:0;top:1rem;height:4px;background:var(--teal);border-radius:2px}
.slot{position:relative;font:inherit;text-align:left;border:2px dashed var(--teal);border-radius:12px;background:transparent;color:var(--ink);padding:.6rem;min-height:120px;cursor:pointer;display:flex;flex-direction:column;gap:.35rem}
.slot::before{content:"";position:absolute;top:-1.55rem;left:50%;width:16px;height:16px;margin-left:-8px;border-radius:50%;background:var(--orange);border:3px solid var(--surface)}
.slot strong{font-family:Caladea,Cambria,Georgia,serif;font-size:1.5rem;color:var(--teal)}
.slot .placed{font-size:1rem;background:var(--teal-soft);border-radius:8px;padding:.35rem .5rem}
.slot.filled{border-style:solid;cursor:default}
.slot.wrong{border-color:var(--orange)}
/* Karte */
.mapwrap{background:var(--sea);border-radius:12px;overflow:hidden}
.mapwrap svg{display:block;width:100%;height:auto}
.land{fill:var(--land);stroke:var(--coast);stroke-width:2}
.route{fill:none;stroke:var(--orange);stroke-width:5;stroke-dasharray:12 9;stroke-linecap:round;stroke-linejoin:round;opacity:.8}
.marker{cursor:pointer}
.marker circle{fill:var(--surface);stroke:var(--teal);stroke-width:4}
.marker .n{font-family:Caladea,Cambria,Georgia,serif;font-weight:700;font-size:26px;fill:var(--teal);text-anchor:middle;dominant-baseline:central}
.marker.done circle{fill:var(--teal)}
.marker.done .n{fill:var(--on-teal)}
.marker.wrong circle{stroke:var(--orange);fill:var(--orange-soft)}
.maplabel{font-family:Caladea,Cambria,Georgia,serif;font-weight:700;font-size:28px;fill:var(--ink);paint-order:stroke;stroke:var(--sea);stroke-width:7px}
.oldroute{fill:none;stroke:var(--teal);stroke-width:5;stroke-dasharray:2 11;stroke-linecap:round;stroke-linejoin:round}
.legbox{fill:var(--surface);opacity:.92}
.legtext{font-family:Carlito,Calibri,Arial,sans-serif;fill:var(--ink)}
.kmap{margin-bottom:1.2rem}
.kmap .dot{fill:var(--teal);stroke:var(--surface);stroke-width:3}
.oceanlabel{font-family:Caladea,Cambria,Georgia,serif;font-style:italic;font-size:28px;fill:var(--teal)}
.kq{border-top:1px solid var(--line);padding:1rem 0 .4rem}
.kq h3{font-family:Caladea,Cambria,Georgia,serif;font-size:1.3rem;font-weight:700;margin:0 0 .6rem}
.kq .opts{display:flex;flex-wrap:wrap;gap:.5rem}
.card.right{border-color:var(--teal);background:var(--teal);color:var(--on-teal);cursor:default}
.kq .fb{min-height:1.4em;margin:.5rem 0 0;font-weight:700}
.kq .fb.good{color:var(--teal)}.kq .fb.bad{color:var(--orange)}
.ltext{font-family:Caladea,Cambria,Georgia,serif;font-size:1.35rem;line-height:2.2;margin:0}
.gap{font:inherit;font-size:1.2rem;display:inline-block;min-width:7em;padding:0 .5rem;margin:0 .15rem;border:none;border-bottom:3px dashed var(--teal);border-radius:6px 6px 0 0;background:var(--teal-soft);color:var(--muted);cursor:pointer;line-height:1.6}
.gap.filled{border-bottom-style:solid;background:transparent;color:var(--teal);font-weight:700;cursor:default;min-width:0}
.gap:focus-visible{outline:3px solid var(--orange);outline-offset:2px}
.paper{margin-top:1rem;padding:.8rem 1rem;border-left:5px solid var(--orange);background:var(--orange-soft);border-radius:0 10px 10px 0}
/* Quiz */
.quizgrid{display:grid;grid-template-columns:1fr 180px;gap:1.2rem}
.qtext{font-family:Caladea,Cambria,Georgia,serif;font-size:1.5rem;line-height:1.25;margin:.2rem 0 1rem}
.answers{display:grid;grid-template-columns:1fr 1fr;gap:.6rem}
.answers button{font:inherit;text-align:left;padding:.75rem .9rem;border-radius:12px;border:2px solid var(--teal);background:var(--surface);color:var(--ink);cursor:pointer}
.answers button .l{font-weight:700;color:var(--orange);margin-right:.4rem}
.answers button.right{background:var(--teal);color:var(--on-teal);border-color:var(--teal)}
.answers button.right .l{color:var(--on-teal)}
.answers button.bad{background:var(--orange-soft);border-color:var(--orange)}
.answers button.gone{visibility:hidden}
.answers button:disabled{cursor:default}
.ladder{list-style:none;margin:0;padding:0;display:flex;flex-direction:column-reverse;gap:.25rem;font-size:1rem}
.ladder li{display:flex;justify-content:space-between;padding:.25rem .6rem;border-radius:8px;color:var(--muted)}
.ladder li.cur{background:var(--orange-soft);color:var(--ink);font-weight:700}
.ladder li.ok{color:var(--teal);font-weight:700}
.ladder li.miss{text-decoration:line-through}
.qfb{min-height:1.5em;margin:.8rem 0 0;font-weight:700}
.qfb.good{color:var(--teal)}.qfb.bad{color:var(--orange)}
@media (max-width:680px){.timeline{grid-template-columns:1fr 1fr;padding-top:0}.timeline::before,.slot::before{display:none}.quizgrid{grid-template-columns:1fr}.ladder{flex-direction:row-reverse;flex-wrap:wrap}.answers{grid-template-columns:1fr}}
/* Weltkarte */
.wmap{background:var(--sea);border-radius:12px;overflow:hidden}
.wmap svg{display:block;width:100%;height:auto}
.wland{fill:var(--land);stroke:var(--coast);stroke-width:1.2;stroke-linejoin:round}
.wroute{fill:none;stroke:var(--orange);stroke-width:3.5;stroke-dasharray:8 6;stroke-linecap:round;stroke-linejoin:round}
.wmap .marker circle{stroke-width:3}
.wmap .marker .n{font-size:17px}
.wmap .maplabel{font-size:17px;stroke-width:5px}
.wmap .oceanlabel{font-size:17px}
/* Richtig oder falsch */
.rf{border-top:1px solid var(--line);padding:.9rem 0 .5rem}
.rf p.s{font-family:Caladea,Cambria,Georgia,serif;font-size:1.25rem;margin:0 0 .5rem}
.rf .opts{display:flex;gap:.5rem}
.rf .fb{margin:.5rem 0 0;font-size:1.02rem}
.rf .fb b.good{color:var(--teal)}.rf .fb b.bad{color:var(--orange)}
.quote{margin:.4rem 0 1rem;padding:.8rem 1rem;border-left:5px solid var(--teal);background:var(--teal-soft);border-radius:0 10px 10px 0;font-family:Caladea,Cambria,Georgia,serif;font-style:italic}
/* Spiel */
.gtop{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:.5rem;margin:.2rem 0 .8rem}
.hearts{font-size:1.6rem;letter-spacing:.15rem}
.hearts .lost{opacity:.22}
.chip{display:inline-block;padding:.25rem .7rem;border-radius:999px;background:var(--teal-soft);color:var(--teal);font-weight:700;font-size:1rem}
.gmap{margin-bottom:1rem}
.gmap .cur{fill:var(--orange);stroke:var(--surface);stroke-width:3}
.gmap .past{fill:var(--teal);stroke:var(--surface);stroke-width:2}
.ring{fill:none;stroke:var(--orange);stroke-width:3;animation:pulse 1.6s infinite}
@keyframes pulse{0%{r:9;opacity:1}100%{r:24;opacity:0}}
@media (prefers-reduced-motion: reduce){.ring{animation:none;opacity:.6}}
.scene h3{font-family:Caladea,Cambria,Georgia,serif;font-size:1.45rem;margin:0 0 .2rem;color:var(--teal)}
.scene .when{color:var(--muted);margin:0 0 .6rem;font-weight:700}
.scene .story{margin:0 0 1rem}
.choices{display:grid;gap:.6rem}
.choices button{font:inherit;text-align:left;padding:.8rem 1rem;border-radius:12px;border:2px solid var(--teal);background:var(--surface);color:var(--ink);cursor:pointer}
.choices button:hover{background:var(--teal-soft)}
.choices button:disabled{cursor:default;opacity:.55}
.choices button.picked{opacity:1;background:var(--orange-soft);border-color:var(--orange)}
.outcome{margin-top:1rem;padding:.9rem 1rem;border-radius:12px;background:var(--bg);border:2px solid var(--line)}
.outcome .t{font-weight:700;margin:0 0 .3rem}
.outcome .t.good{color:var(--teal)}.outcome .t.bad{color:var(--orange)}
.outcome .wissen{margin:.6rem 0 0;padding-top:.6rem;border-top:1px dashed var(--line)}
.outcome .wissen b{color:var(--teal)}
.endbox{text-align:center;padding:1rem .5rem}
.endbox .big{font-family:Caladea,Cambria,Georgia,serif;font-size:2rem;color:var(--teal);margin:.2rem 0 .6rem;line-height:1.15}
.endbox.bad .big{color:var(--orange)}
.endbox p{max-width:640px;margin:.4rem auto}
.fates{text-align:left;max-width:640px;margin:1rem auto 0;padding:0;list-style:none}
.fates li{padding:.45rem .2rem;border-top:1px solid var(--line)}
.fates li b{color:var(--teal)}
.rmap{background:var(--sea);border-radius:12px;overflow:hidden}
.rmap svg{display:block;width:100%;height:auto}
.rland{fill:var(--land);stroke:var(--coast);stroke-width:1.5;stroke-linejoin:round}
.reich{stroke-width:2;stroke-dasharray:6 5;opacity:.85}
.reich.az{fill:rgba(201,102,26,.22);stroke:var(--orange)}
.reich.in{fill:rgba(31,111,120,.22);stroke:var(--teal)}
.croute{fill:none;stroke-width:4;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:10 7}
.croute.c{stroke:var(--orange)}.croute.p{stroke:var(--teal)}
.reichlabel{font-family:Caladea,Cambria,Georgia,serif;font-weight:700;font-size:22px;paint-order:stroke;stroke:var(--sea);stroke-width:5px}
.reichlabel.az{fill:var(--orange)}.reichlabel.in{fill:var(--teal)}
.rmap .maplabel{font-size:21px}
/* Vergleich */
.cols{display:grid;grid-template-columns:1fr 1fr;gap:.8rem}
.col{border:2px dashed var(--teal);border-radius:12px;padding:.7rem;min-height:180px;cursor:pointer;background:transparent;font:inherit;color:var(--ink);text-align:left;display:flex;flex-direction:column;gap:.4rem}
.col h3{font-family:Caladea,Cambria,Georgia,serif;margin:0 0 .3rem;font-size:1.35rem;color:var(--teal)}
.col.az h3{color:var(--orange)}.col.az{border-color:var(--orange)}
.col .placed{background:var(--teal-soft);border-radius:8px;padding:.35rem .55rem;font-size:1.02rem}
.col.az .placed{background:var(--orange-soft)}
/* Detektiv */
.case{font-family:Caladea,Cambria,Georgia,serif;font-size:1.3rem;line-height:1.35;background:var(--bg);border-left:5px solid var(--orange);border-radius:0 12px 12px 0;padding:1rem 1.1rem;margin:.4rem 0 1rem}
.factors{display:grid;grid-template-columns:repeat(3,1fr);gap:.5rem}
.factors button{font:inherit;padding:.7rem .5rem;border-radius:12px;border:2px solid var(--teal);background:var(--surface);color:var(--ink);cursor:pointer}
.factors button .ico{display:block;font-size:1.6rem}
.factors button.right{background:var(--teal);color:var(--on-teal)}
.factors button.bad{background:var(--orange-soft);border-color:var(--orange)}
.progress{height:10px;border-radius:5px;background:var(--line);overflow:hidden;margin:.3rem 0 .8rem}
.progress span{display:block;height:100%;background:var(--teal);transition:width .3s}
.dfb{min-height:3em;margin:.8rem 0 0}
.dfb b.good{color:var(--teal)}.dfb b.bad{color:var(--orange)}
/* Folgen */
.people{display:grid;grid-template-columns:repeat(20,1fr);gap:4px;margin:.8rem 0;max-width:620px}
.people span{aspect-ratio:1/1.6;border-radius:50% 50% 25% 25%/30% 30% 20% 20%;background:var(--teal);transition:opacity 1.2s,background 1.2s}
.people span.gone{opacity:.12;background:var(--muted)}
@media (prefers-reduced-motion: reduce){.people span{transition:none}}
.yr{display:flex;gap:.5rem;margin-top:.4rem}
.yr .btn[aria-pressed="true"]{background:var(--orange);border-color:var(--orange);color:#fff}
.fbox{border-top:1px solid var(--line);margin-top:1.2rem;padding-top:1rem}
.fbox h3{font-family:Caladea,Cambria,Georgia,serif;font-size:1.35rem;margin:0 0 .5rem}
.mc{display:grid;gap:.5rem}
.mc .card.right{background:var(--teal);color:var(--on-teal);border-color:var(--teal)}
.pairs{display:grid;grid-template-columns:1fr 1fr;gap:.5rem;align-items:start}
.pairs .left .card{width:100%;margin-bottom:.5rem}
.pairs .left .card.matched{border-color:var(--teal);background:var(--teal-soft);cursor:default}
@media (max-width:680px){.cols,.pairs{grid-template-columns:1fr}.factors{grid-template-columns:1fr 1fr}.people{grid-template-columns:repeat(10,1fr)}}
.leg{fill:none;stroke-width:5;stroke-linecap:round}
.leg.l1{stroke:#7A5230}.leg.l2{stroke:#B3261E}.leg.l3{stroke:var(--teal)}
.leg.on{stroke-width:8}
.legn circle{stroke:var(--surface);stroke-width:3}.legn text{font-family:Caladea,Cambria,Georgia,serif;font-weight:700;font-size:22px;fill:#fff;text-anchor:middle;dominant-baseline:central}
.legn.l1 circle{fill:#7A5230}.legn.l2 circle{fill:#B3261E}.legn.l3 circle{fill:var(--teal)}
.cols3{display:grid;grid-template-columns:repeat(3,1fr);gap:.6rem;margin-top:1rem}
.cols3 .col h3{font-size:1.1rem}
.cols3 .col.l1{border-color:#7A5230}.cols3 .col.l1 h3{color:#7A5230}
.cols3 .col.l2{border-color:#B3261E}.cols3 .col.l2 h3{color:#B3261E}
.cols3 .col.l3{border-color:var(--teal)}
.chain{list-style:none;padding:0;margin:0 0 1rem;counter-reset:c}
.chain li{position:relative;padding:.6rem .8rem .6rem 3rem;margin-bottom:.9rem;background:var(--teal-soft);border-radius:10px;counter-increment:c}
.chain li::before{content:counter(c);position:absolute;left:.7rem;top:50%;transform:translateY(-50%);width:1.7rem;height:1.7rem;border-radius:50%;background:var(--teal);color:var(--on-teal);display:grid;place-items:center;font-weight:700}
.chain li:not(:last-child)::after{content:"↓";position:absolute;left:1.15rem;bottom:-1.05rem;color:var(--teal);font-weight:700}
.est{border-top:1px solid var(--line);padding:1rem 0}
.est h3{font-family:Caladea,Cambria,Georgia,serif;font-size:1.3rem;margin:0 0 .6rem}
.est .row{display:flex;align-items:center;gap:.8rem;flex-wrap:wrap}
.est input[type=range]{flex:1;min-width:200px;accent-color:var(--orange);height:2rem}
.est .val{font-weight:700;font-size:1.25rem;min-width:7.5em;color:var(--orange)}
.bars{margin:.8rem 0 .4rem;display:grid;gap:.35rem}
.bars div{display:grid;grid-template-columns:6.5em 1fr;align-items:center;gap:.5rem;font-size:.98rem}
.bars i{display:block;height:18px;border-radius:9px;transition:width .8s}
.bars .g i{background:var(--orange)}.bars .r i{background:var(--teal)}
.stars{color:var(--orange);font-size:1.2rem;letter-spacing:.1rem}
.est .exp{margin:.4rem 0 0}
.un{margin-top:1rem;padding:1rem 1.1rem;border:2px solid var(--teal);border-radius:12px;background:var(--teal-soft)}
.un b{color:var(--teal)}
.intro{margin:0 0 1rem;padding:.8rem 1rem;border-left:5px solid var(--orange);background:var(--orange-soft);border-radius:0 10px 10px 0}
@media (max-width:680px){.cols3{grid-template-columns:1fr}}
.timeline.six{padding-top:0}.timeline.six::before,.timeline.six .slot::before{display:none}
.namebox{display:flex;gap:.6rem;flex-wrap:wrap;align-items:center;margin:0 0 1rem}
.namebox input{font:inherit;padding:.5rem .7rem;border-radius:10px;border:2px solid var(--line);background:var(--surface);color:var(--ink);min-width:14em}
.sticky{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding:.5rem 0;margin-bottom:.8rem}
.task5{margin-bottom:1rem}
.task5 h2{font-size:1.35rem;display:flex;justify-content:space-between;gap:.8rem;align-items:baseline}
.task5 h2 .pt{font-family:Carlito,Calibri,Arial,sans-serif;font-size:1rem;color:var(--muted);white-space:nowrap}
.task5 h2 .pt.full{color:var(--teal)}.task5 h2 .pt.part{color:var(--orange)}
.mrow{display:grid;grid-template-columns:1fr auto;gap:.6rem;align-items:center;padding:.5rem 0;border-top:1px solid var(--line)}
.mrow select{font:inherit;padding:.4rem .5rem;border-radius:8px;border:2px solid var(--teal);background:var(--surface);color:var(--ink);max-width:16em}
.mrow.ok select,.mrow.ok .rfb button.on{border-color:var(--teal);background:var(--teal-soft)}
.mrow.bad select,.mrow.bad .rfb button.on{border-color:var(--orange);background:var(--orange-soft)}
.rfb{display:flex;gap:.4rem}
.rfb button{font:inherit;font-size:.95rem;padding:.35rem .7rem;border-radius:999px;border:2px solid var(--teal);background:var(--surface);color:var(--teal);cursor:pointer}
.rfb button.on{background:var(--teal);color:var(--on-teal)}
.corr{grid-column:1/-1;font-size:.95rem;color:var(--orange);margin:0}
.picks{display:flex;flex-wrap:wrap;gap:.5rem}
.picks .card.on{border-color:var(--teal);background:var(--teal);color:var(--on-teal)}
.picks .card.ok{border-color:var(--teal);background:var(--teal-soft);color:var(--ink)}
.picks .card.bad{border-color:var(--orange);background:var(--orange-soft);color:var(--ink);text-decoration:line-through}
.picks .card.miss{border-style:dashed;border-color:var(--teal)}
.hint{color:var(--muted);font-size:.95rem;margin:.2rem 0 .6rem}
.t5{width:100%;border-collapse:collapse}
.t5 th,.t5 td{border:1px solid var(--line);padding:.45rem .5rem;text-align:left;vertical-align:middle}
.t5 th{background:var(--teal-soft)}
.t5 select{font:inherit;width:100%;padding:.35rem;border-radius:8px;border:2px solid var(--teal);background:var(--surface);color:var(--ink)}
.t5 td.ok select{background:var(--teal-soft)}.t5 td.bad select{border-color:var(--orange);background:var(--orange-soft)}
.t5 .corr{display:block;margin-top:.2rem}
.result{text-align:center;padding:1.4rem 1rem}
.scorering{width:170px;height:170px;margin:0 auto .6rem;display:block}
.scorering .bg{fill:none;stroke:var(--line);stroke-width:14}
.scorering .fg{fill:none;stroke:var(--teal);stroke-width:14;stroke-linecap:round;transform:rotate(-90deg);transform-origin:50% 50%;transition:stroke-dashoffset 1.4s ease}
.scorering text{font-family:Caladea,Cambria,Georgia,serif;font-weight:700;fill:var(--ink);text-anchor:middle}
.grade{font-family:Caladea,Cambria,Georgia,serif;font-size:2.2rem;color:var(--teal);margin:.2rem 0}
.ptab{margin:1rem auto 0;border-collapse:collapse;min-width:min(100%,420px)}
.ptab td{border-top:1px solid var(--line);padding:.35rem .6rem;text-align:left}
.ptab td:last-child{text-align:right;font-weight:700}
.tips{text-align:left;max-width:560px;margin:1rem auto 0;padding:.8rem 1rem;border-left:5px solid var(--orange);background:var(--orange-soft);border-radius:0 10px 10px 0}
.tips ul{margin:.4rem 0 0;padding-left:1.2rem}
.tips a{color:var(--teal);font-weight:700}
.fact{margin:.6rem 0 0;font-size:.95rem;color:var(--muted)}
</style>
</head>
<body>
<div class="wrap">
<header>
  <p>Geschichte, 3. Klasse – Frühe Neuzeit</p>
  <h1>Online-Test: Entdeckungen und Eroberungen</h1>
  <p>Neun Aufgaben, 32 Punkte. Du bekommst erst nach der Abgabe dein Ergebnis – also in Ruhe arbeiten und alles noch einmal kontrollieren!</p>
  <svg class="routeline" viewBox="0 0 800 34" preserveAspectRatio="none" aria-hidden="true"><path d="M10 24 C 150 4, 260 32, 400 16 S 650 6, 790 20"/><circle cx="10" cy="24" r="5"/><circle cx="790" cy="20" r="5"/></svg>
</header>
<div class="namebox"><label for="name"><b>Dein Name:</b></label><input id="name" autocomplete="off" placeholder="Vorname"></div>
<section id="result" hidden></section>
<div class="sticky"><div class="progress" aria-hidden="true"><span id="bar" style="width:0"></span></div><span id="prog" aria-live="polite"></span></div>
<div id="tasks"></div>
<div class="tools" style="justify-content:center;margin-top:1.5rem"><button class="btn" id="submit" style="font-size:1.2rem;padding:.8rem 1.8rem">Test abgeben</button></div>
</div>
<script>
const $=s=>document.querySelector(s);
function el(t,c,x){const e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
let submitted=false;const T=[];
function sel(opts,ph="– wählen –"){const s=el("select");s.append(new Option(ph,""));shuffle(opts).forEach(o=>s.append(new Option(o,o)));s.onchange=progress;return s}
function addTask(n,title,max,build,grade,fact,tip){const sec=el("section","task5");const h=el("h2");h.append(document.createTextNode(`Aufgabe ${n}: ${title}`));const pt=el("span","pt",`${max} P.`);h.append(pt);sec.append(h);
  const api=build(sec);T.push({n,title,max,api,grade,pt,sec,fact,tip});$("#tasks").append(sec)}

/* A1 */
const A1=[["Kolumbus landet in der Karibik.","1492"],["Die Osmanen erobern Konstantinopel.","1453"],["Die Victoria kehrt von der ersten Weltumsegelung zurück.","1522"],["Vasco da Gama erreicht Indien.","1498"],["Tenochtitlan wird von den Spaniern erobert.","1521"]];
addTask(1,"Ordne die Jahreszahlen zu",5,sec=>{sec.append(el("p","hint","Wähle bei jedem Ereignis das passende Jahr. Jede Jahreszahl passt genau einmal."));const rows=A1.map(a=>{const r=el("div","mrow");r.append(el("span",null,a[0]));const s=sel(A1.map(x=>x[1]).sort());r.append(s);sec.append(r);return {r,s,a}});return {rows,done:()=>rows.filter(x=>x.s.value).length/rows.length}},
 api=>{let p=0;api.rows.forEach(({r,s,a})=>{s.disabled=true;if(s.value===a[1]){p++;r.classList.add("ok")}else{r.classList.add("bad");r.append(el("p","corr","Lösung: "+a[1]))}});return p},
 "1453, 1492, 1498, 1521, 1522 – zwischen der Eroberung Konstantinopels und der ersten Weltumsegelung liegen nur 69 Jahre. In dieser kurzen Zeit veränderte sich das Weltbild der Europäer völlig.",null);

/* Mehrfachauswahl-Helfer */
function picks(sec,good,bad,need,hint){sec.append(el("p","hint",hint));const box=el("div","picks");const chosen=new Set();const btns=[];
  shuffle([...good.map(g=>[g,true]),...bad.map(b=>[b,false])]).forEach(([t,ok])=>{const b=el("button","card",t);b._ok=ok;b.setAttribute("aria-pressed","false");
    b.onclick=()=>{if(submitted)return;if(chosen.has(b)){chosen.delete(b);b.classList.remove("on");b.setAttribute("aria-pressed","false")}else{if(chosen.size>=need)return;chosen.add(b);b.classList.add("on");b.setAttribute("aria-pressed","true")}progress()};btns.push(b);box.append(b)});
  sec.append(box);return {chosen,btns,need,done:()=>chosen.size/need}}
function gradePicks(api){let p=0;api.btns.forEach(b=>{b.classList.remove("on");if(api.chosen.has(b)){if(b._ok){p++;b.classList.add("ok")}else b.classList.add("bad")}});if(p<api.need)api.btns.forEach(b=>{if(b._ok&&!api.chosen.has(b))b.classList.add("miss")});const n=el("p","hint",p<api.need?"Gestrichelt umrandet: weitere richtige Antworten.":"");api.btns[0].parentNode.after(n);return Math.min(p,api.need)}

/* A2 */
addTask(2,"Warum gingen die Europäer auf Entdeckungsfahrt?",3,sec=>picks(sec,["Sie wollten Gewürze direkt aus Asien holen, ohne teure Zwischenhändler.","Die Könige wollten Macht und neue Gebiete.","Die Kirche wollte das Christentum verbreiten.","Die Seefahrer träumten von Ruhm und Reichtum."],["Sie wollten Amerika besuchen, das sie aus Büchern kannten.","In Europa gab es nicht genug Trinkwasser.","Sie wollten beweisen, dass die Erde eine Scheibe ist."],3,"Wähle genau drei richtige Gründe."),gradePicks,
 "Die drei großen Antriebe fasste man später so zusammen: „Gott, Gold und Ruhm“.","aufbruch-uebungen.html");

/* A3 */
const A3=[["Kompass","Himmelsrichtung bestimmen"],["Jakobsstab","Position (Breitengrad) über Sonne/Sterne bestimmen"],["Karavelle","schnell und auch gegen den Wind segeln"]];
addTask(3,"Wozu brauchten die Seefahrer diese Erfindungen?",3,sec=>{const rows=A3.map(a=>{const r=el("div","mrow");r.append(el("b",null,a[0]));const s=sel(A3.map(x=>x[1]));r.append(s);sec.append(r);return {r,s,a}});return {rows,done:()=>rows.filter(x=>x.s.value).length/rows.length}},
 api=>{let p=0;api.rows.forEach(({r,s,a})=>{s.disabled=true;if(s.value===a[1]){p++;r.classList.add("ok")}else{r.classList.add("bad");r.append(el("p","corr","Lösung: "+a[1]))}});return p},
 "Den Längengrad konnte man damals noch nicht genau bestimmen – das gelang erst im 18. Jahrhundert mit sehr genauen Uhren auf Schiffen.","erfinder-uebungen.html");

/* A4 */
const A4=[["Kolumbus wusste, dass er einen neuen Kontinent gefunden hatte.",false,"Er glaubte bis zu seinem Tod, in Asien gewesen zu sein."],["Magellan kam lebend von der Weltumsegelung zurück.",false,"Er wurde 1521 auf den Philippinen getötet."],["Die Hauptstadt der Inka war Cusco.",true,""],["Die meisten Menschen in Amerika starben an eingeschleppten Krankheiten.",true,""],["Skorbut entsteht durch Mangel an Vitamin C.",true,""]];
addTask(4,"Richtig oder falsch?",5,sec=>{const rows=A4.map(a=>{const r=el("div","mrow");r.append(el("span",null,a[0]));const g=el("div","rfb");let v=null;const bs=[["richtig",true],["falsch",false]].map(([t,val])=>{const b=el("button",null,t);b.onclick=()=>{if(submitted)return;v=val;bs.forEach(x=>x.classList.toggle("on",x===b));progress()};g.append(b);return b});r.append(g);sec.append(r);return {r,a,get v(){return v}}});return {rows,done:()=>rows.filter(x=>x.v!==null).length/rows.length}},
 api=>{let p=0;api.rows.forEach(x=>{if(x.v===x.a[1]){p++;x.r.classList.add("ok")}else{x.r.classList.add("bad");x.r.append(el("p","corr","Lösung: "+(x.a[1]?"richtig":"falsch")+(x.a[2]?" – "+x.a[2]:"")))}});return p},
 "Cusco liegt auf rund 3.400 Metern Höhe – höher als der Großglockner, Österreichs höchster Berg!","magellan-uebungen.html");

/* A5 */
const A5=[["Hauptstadt","Tenochtitlan","Cusco",["Tenochtitlan","Cusco","Tikal","Machu Picchu"]],["Heutiges Land","Mexiko","Peru",["Mexiko","Peru","Brasilien","Spanien"]],["Eine besondere Leistung","schwimmende Gärten im See","Straßen mit Hängebrücken",["schwimmende Gärten im See","Straßen mit Hängebrücken","die Erfindung des Kompasses","Schiffe aus Eisen"]]];
addTask(5,"Ergänze die Tabelle zu den Hochkulturen",6,sec=>{sec.append(el("p","hint","Bei der „besonderen Leistung“ gibt es mehrere richtige Möglichkeiten – hier ist je eine zur Auswahl."));
  const t=el("table","t5");const h=el("tr");h.append(el("th"),el("th",null,"Azteken"),el("th",null,"Inka"));t.append(h);const cells=[];
  A5.forEach(a=>{const r=el("tr");r.append(el("th",null,a[0]));[a[1],a[2]].forEach(ans=>{const td=el("td");const s=sel(a[3]);td.append(s);r.append(td);cells.push({td,s,ans})});t.append(r)});
  const w=el("div");w.style.overflowX="auto";w.append(t);sec.append(w);return {cells,done:()=>cells.filter(c=>c.s.value).length/cells.length}},
 api=>{let p=0;api.cells.forEach(c=>{c.s.disabled=true;if(c.s.value===c.ans){p++;c.td.classList.add("ok")}else{c.td.classList.add("bad");c.td.append(el("span","corr","Lösung: "+c.ans))}});return p},
 "Andere besondere Leistungen: die Azteken hatten Kakaobohnen als Geld, die Inka Knotenschnüre (Quipu) statt Schrift und Läufer als Boten.",null);

/* A6 */
addTask(6,"Warum siegten wenige Hundert Spanier über das große Aztekenreich?",3,sec=>picks(sec,["Krankheiten wie die Pocken töteten sehr viele Azteken.","Die Spanier hatten Waffen aus Stahl, Gewehre und Kanonen.","Viele unterdrückte Völker kämpften auf der Seite der Spanier.","Pferde waren in Amerika unbekannt und wirkten erschreckend.","Cortés nahm den Herrscher Moctezuma gefangen."],["Die Spanier hatten viel mehr Soldaten als die Azteken.","Die Azteken hatten keine Armee.","Die Azteken ergaben sich freiwillig, weil sie Spanier werden wollten."],3,"Wähle genau drei richtige Gründe."),gradePicks,
 "Historiker sagen: Der wichtigste Grund waren die Krankheiten – sie töteten weit mehr Menschen als alle Kämpfe.","eroberung-uebungen.html#detektiv");

/* A7 */
const A7=[["von Europa nach Afrika","Waffen, Stoffe, Alkohol und Glasperlen"],["von Afrika nach Amerika","versklavte Menschen"],["von Amerika nach Europa","Zucker, Baumwolle, Tabak und Kaffee"]];
addTask(7,"Was wurde beim Dreieckshandel transportiert?",3,sec=>{const rows=A7.map(a=>{const r=el("div","mrow");r.append(el("b",null,a[0]));const s=sel(A7.map(x=>x[1]));r.append(s);sec.append(r);return {r,s,a}});return {rows,done:()=>rows.filter(x=>x.s.value).length/rows.length}},
 api=>{let p=0;api.rows.forEach(({r,s,a})=>{s.disabled=true;if(s.value===a[1]){p++;r.classList.add("ok")}else{r.classList.add("bad");r.append(el("p","corr","Lösung: "+a[1]))}});return p},
 "Rund 12,5 Millionen Menschen wurden zwischen 1500 und 1866 aus Afrika verschleppt.","sklaverei-uebungen.html#dreieck");

/* A8 */
const A8=[["Was ist eine Kolonie?","ein Gebiet außerhalb Europas, das von einem europäischen Land beherrscht und ausgebeutet wird",["ein Vertrag zwischen Spanien und Portugal","eine Stadt, die Händler gemeinsam gründen","ein Schiff, das Waren über den Atlantik bringt"]],["Was bedeutet Globalisierung?","weltweiter Austausch von Waren und Informationen",["die erste Fahrt um die ganze Welt","der Bau des ersten Globus","die Aufteilung der Welt zwischen zwei Ländern"]]];
addTask(8,"Begriffe: Kolonie und Globalisierung",2,sec=>{const qs=A8.map(a=>{const box=el("div","mrow");box.style.gridTemplateColumns="1fr";box.append(el("b",null,a[0]));const g=el("div","picks");let v=null;const bs=shuffle([a[1],...a[2]]).map(t=>{const b=el("button","card",t);b._t=t;b.onclick=()=>{if(submitted)return;v=t;bs.forEach(x=>x.classList.toggle("on",x===b));progress()};g.append(b);return b});box.append(g);sec.append(box);return {a,bs,get v(){return v}}});return {qs,done:()=>qs.filter(q=>q.v).length/qs.length}},
 api=>{let p=0;api.qs.forEach(q=>q.bs.forEach(b=>{b.classList.remove("on");if(b._t===q.a[1]){b.classList.add(q.v===b._t?"ok":"miss");if(q.v===b._t)p++}else if(q.v===b._t)b.classList.add("bad")}));return p},
 "Auch heute leben wir in einer globalisierten Welt: Dein Handy enthält Rohstoffe aus mehreren Kontinenten.","kolonien-uebungen.html");

/* A9 */
addTask(9,"Kolumbus – der „Entdecker Amerikas“?",2,sec=>picks(sec,["In Amerika lebten schon Millionen Menschen – sie kannten ihr Land längst.","Die Wikinger waren schon um das Jahr 1000 in Nordamerika.","Kolumbus glaubte bis zu seinem Tod, in Asien gewesen zu sein."],["Kolumbus betrat als erster Mensch überhaupt amerikanischen Boden.","Amerika wurde nach Kolumbus benannt, also hat er es entdeckt.","Kolumbus wusste genau, dass die Erde viel größer ist, als alle dachten."],2,"Wähle zwei Argumente, die zeigen, warum „Entdecker“ nicht ganz passt."),gradePicks,
 "Amerika ist nach Amerigo Vespucci benannt – er erkannte, dass es ein eigener Kontinent ist.",null);

/* Fortschritt & Abgabe */
function progress(){if(submitted)return;const d=T.filter(t=>t.api.done()>=1).length;$("#prog").textContent=`${d} von ${T.length} Aufgaben vollständig bearbeitet`;$("#bar").style.width=(T.reduce((s,t)=>s+Math.min(1,t.api.done()),0)/T.length*100)+"%"}
const NAMES={"aufbruch-uebungen.html":"Aufbruch über die Meere","erfinder-uebungen.html":"Erfindungen","magellan-uebungen.html":"Die erste Weltumsegelung","eroberung-uebungen.html#detektiv":"Die Spanier erobern Amerika – Ursachen-Detektiv","sklaverei-uebungen.html#dreieck":"Dreieckshandel","kolonien-uebungen.html":"Die Welt wird aufgeteilt"};
function grade(p){return p>=30?["A","Ausgezeichnet!"]:p>=26?["B","Sehr gut gemacht!"]:p>=21?["C","Gut – da geht noch was!"]:p>=16?["D","Bestanden – schau dir die Tipps an."]:["E","Noch nicht geschafft – üb mit den Tipps und versuch es noch einmal."]}
$("#submit").onclick=()=>{const open=T.filter(t=>t.api.done()<1);
  if(open.length&&!confirm(`Du hast ${open.length} Aufgabe(n) noch nicht vollständig bearbeitet. Trotzdem abgeben?`))return;
  submitted=true;let total=0;const tips=new Set();
  T.forEach(t=>{const p=t.grade(t.api);total+=p;t.p=p;t.pt.textContent=`${p} / ${t.max} P.`;t.pt.className="pt "+(p===t.max?"full":"part");if(p<t.max&&t.tip)tips.add(t.tip);
    const f=el("p","fact");f.append(el("b",null,"Wusstest du? "),document.createTextNode(t.fact));t.sec.append(f)});
  document.querySelectorAll("select").forEach(s=>s.disabled=true);$("#submit").remove();
  const [g,txt]=grade(total);const R=$("#result");R.hidden=false;R.innerHTML="";const box=el("div","result");
  const nm=$("#name").value.trim();$("#name").disabled=true;
  const C=2*Math.PI*70;box.insertAdjacentHTML("beforeend",`<svg class="scorering" viewBox="0 0 170 170" aria-hidden="true"><circle class="bg" cx="85" cy="85" r="70"/><circle class="fg" id="fg" cx="85" cy="85" r="70" stroke-dasharray="${C}" stroke-dashoffset="${C}"/><text x="85" y="92" font-size="34">${total}/32</text></svg>`);
  box.append(el("p","grade",`Note ${g}`),el("p",null,(nm?nm+": ":"")+txt));
  const tab=el("table","ptab");T.forEach(t=>{const r=el("tr");r.append(el("td",null,`Aufgabe ${t.n}`),el("td",null,`${t.p} / ${t.max}`));tab.append(r)});box.append(tab);
  box.append(el("p","hint","Notenschlüssel: 0–15 = E · 16–20 = D · 21–25 = C · 26–29 = B · 30–32 = A"));
  if(tips.size){const tp=el("div","tips");tp.append(el("b",null,"Zum Wiederholen:"));const ul=el("ul");tips.forEach(u=>{const li=el("li");const a=el("a",null,NAMES[u]);a.href=u;a.target="_blank";a.rel="noopener";li.append(a);ul.append(li)});tp.append(ul);box.append(tp)}
  const tl=el("div","tools");tl.style.justifyContent="center";const again=el("button","btn ghost","Neuer Versuch");again.onclick=()=>location.reload();tl.append(again);box.append(tl);
  box.append(el("p","hint","Scroll nach unten: Bei jeder Aufgabe siehst du jetzt, was richtig war – und eine spannende Zusatzinfo."));
  R.append(box);$("#prog").textContent=`Abgegeben: ${total} von 32 Punkten`;$("#bar").style.width=(total/32*100)+"%";
  R.scrollIntoView({behavior:"smooth",block:"start"});requestAnimationFrame(()=>requestAnimationFrame(()=>{$("#fg").style.strokeDashoffset=C*(1-total/32)}))};
progress();
</script>
</body>
</html>
